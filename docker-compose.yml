# Sobe o banco e a API localmente. O app mobile roda fora do Docker (Expo).
#
#   docker compose up --build
#
# API: http://localhost:4444/health
# Contas de demonstração (criadas na subida): veja o README.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calendo
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calendo"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4444
      # O interpretador local do assistente usa o fuso do processo.
      TZ: America/Sao_Paulo
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: calendo
      DB_TIMEZONE: America/Sao_Paulo
      JWT_SECRET: segredo-local-somente-para-demonstracao-0001
      # Opcional: exporte a chave antes de subir para ligar a IA da OpenAI.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # Cria as tabelas, as contas de demonstração e sobe a API.
    command: >
      sh -c "node scripts/seed-demo.js && node src/app.js"
    ports:
      - "4444:4444"

volumes:
  db-data:
